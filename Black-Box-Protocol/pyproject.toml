[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheionagi-vendor-neutral-black-box"
version = "0.2.0"
description = "Frozen, vendor-neutral behavioral benchmark for grounding and hallucination controls"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
reporting = ["matplotlib>=3.9,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "adversarial*", "protocol*"]

[tool.setuptools.package-data]
adversarial = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
