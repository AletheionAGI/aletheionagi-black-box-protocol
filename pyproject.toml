[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheionagi-black-box-protocol"
version = "1.0.0"
description = "Independent black-box evaluation runner for the public AletheionAGI API."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
aletheion-black-box = "aletheion_black_box.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
